# ────────────────────────────────────────────────────────────
# Hyprland — H1 Light (iliFalk/h1-design-system)
# ────────────────────────────────────────────────────────────

general {
    col.active_border = rgb(0078B3)
    col.inactive_border = rgb(DDD8CA)
    border_size = 6
    gaps_in = 5
    gaps_out = 5
}

group {
    col.border_active = rgba(0078B3ee)
    col.border_inactive = rgb(DDD8CA)

    groupbar {
        col.active = rgba(0078B399)
        col.inactive = rgba(DDD8CA88)
        text_color = rgb(1A1A18)
        text_color_inactive = rgba(00638Fee)
    }
}

decoration {
  rounding = 4
  rounding_power = 3
  shadow {
  enabled = yes
  render_power = 8
  range = 16
  color = rgba(00000033)
  }
}
